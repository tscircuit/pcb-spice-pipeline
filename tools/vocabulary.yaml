  - expect fail fall find finish flip flush generate get has invoke is link load locate match measure
  - merge normalize omit override parse produce quote raise read receive reduce refine register remove rename
  - replace reset resolve rise run select set shift skip solve sort split start supply test transmit
  - unlink update use validate view visit write
  # states and outcomes
  - connected contained default failure found grounded killed named oriented pinned scoped seen supplied
  - unavailable unconverged unevaluated unselected used
  # data shapes and code structure
  - all any array attachment base binding body boolean box bucket budget byte candidate cell chain child
  - code column command comment content context count data declaration definition descriptor element
  - entry error event expression field file first format graph grid group hash index input item key
  - kind label last level line list location log map mapping member message metadata method mode name
  - namespace number option options order output owner package parent part path pattern payload piece
  - plan policy prefix progress record reference request rest result root row schema section selection
  - selector series source state status table text title token tree type unit validation value
  # program runs and tools
  - adapter comparison conversion converter diagram directory domain engine fast faster invocation tool
  # report and user interface
  - ambiguity approximation button canvas client color description detail download drag font hint issue
  - limitation listener overlay overview plot reason report role summary tab viewer warning
  # describing and comparing
  - absolute active analytic best canonical common compatible compatibility condition convention direct
  - empty equivalent exact expected finite fixed flat full global high horizontal inner limit low lowest
  - max maximum middle min minimum native negative next numeric original other outer own physical
  - positive preceding previous primitive prior pure quiet range raw relative safe serial target threshold
  - characterization compliance
  # quantities, electricity and units
  - amount amplitude bit current denominator duration electrical energy factor farad fraction frequency
  - interval material matrix measurement milliseconds ohm offset origin peak period phase plateau
  - quantity reduction sample scale seconds speed step time timeout tolerance transmission voltage zero
  # math
  - cholesky delaunay interpolation multiply norm sum symmetrize transpose union
  # geometry
  - alignment anchor ancestor area aspect border boundary center contact connection coordinate curve
  - depth direction distance division edge endpoint epsilon face gap height hole left length nearest
  - outline point position profile radius right round segment side sign size sizing spacing surface
  - thickness triangle width
  # axis letters and their steps or counts (x, dx = step along x, nx = count along x)
  - x y z dx dy nx ny nz
  # place and relation words
  - after along at before between by for from in inside of on out per through to up within
  # irregular plurals the checker cannot reduce
  - indices matrices stimuli
  # other everyday words
  - seed

avoid:
  centre: center
  col: column
  ctx: context
  eps: epsilon
  hi: high
  lo: low
  mid: middle
  neg: negative
  num: number
  polys: polygon
  pos: positive
  pts: point
  refs: reference
  src: source
  tris: triangle
