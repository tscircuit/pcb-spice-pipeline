<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="510" viewBox="0 0 1260 510"><rect width="1260" height="510" fill="#0b1422"/><g font-family="sans-serif" fill="#eef4ff"><text x="24" y="36" font-size="22">Native TSX channel preparation</text><g transform="translate(16 0)"><rect x="0" y="60" width="400" height="425" rx="12" fill="#142439"/><text x="18" y="92" font-size="19">1 / Native via dimensions</text><rect x="15" y="112" width="370" height="208" rx="8" fill="#12352f"/><polyline points="43,216 43,216 43,216 43,216 353,216 353,216 353,216 353,216" fill="none" stroke="#ffca67" stroke-width="5.166666666666667" stroke-linejoin="round" stroke-linecap="round"/><circle cx="43" cy="216" r="8" fill="#e8b962" stroke="#091a1a" stroke-width="2"/><circle cx="353" cy="216" r="8" fill="#e8b962" stroke="#091a1a" stroke-width="2"/><circle cx="43" cy="216" r="19" fill="none" stroke="#ff6e75" stroke-width="3"/><circle cx="353" cy="216" r="19" fill="none" stroke="#ff6e75" stroke-width="3"/><text x="31" y="250" font-size="14">TX.DQ</text><text x="311" y="250" font-size="14">RX.DQ</text><text x="18" y="349" font-size="14">Look at the two highlighted via-in-pad transitions.</text><text x="18" y="371" font-size="14">The native pcb_via records contain 0.2 mm holes.</text><text x="18" y="393" font-size="14">The trace via vertices omit dimensions.</text><text x="18" y="440" font-size="15" fill="#7de7af">Prepared successfully</text><text x="18" y="465" font-size="12" fill="#a7b9cf">Trace coordinates rendered from native Circuit output</text></g><g transform="translate(428 0)"><rect x="0" y="60" width="400" height="425" rx="12" fill="#142439"/><text x="18" y="92" font-size="19">2 / Net binding bypass</text><rect x="15" y="112" width="370" height="208" rx="8" fill="#12352f"/><polyline points="43,216 43,216 43,216 353,216 353,216 353,216" fill="none" stroke="#ffca67" stroke-width="5.166666666666667" stroke-linejoin="round" stroke-linecap="round"/><circle cx="43" cy="216" r="8" fill="