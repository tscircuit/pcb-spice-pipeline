 y="393" font-size="14">Copper slabs must join at this bend.</text><text x="18" y="440" font-size="15" fill="#7de7af">Prepared successfully</text><text x="18" y="465" font-size="12" fill="#a7b9cf">Trace coordinates rendered from native Circuit output</text></g></g></svg>
