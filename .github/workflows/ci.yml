name: Native extraction and simulation
on: [push, pull_request, workflow_dispatch]
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: ./scripts/reproduce.sh
      # No solver-source/binary or copyrighted vendor-archive artifact upload.
