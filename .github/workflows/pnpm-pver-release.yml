# Adapted from @tscircuit/plop's bun-pver-release workflow.
name: Publish to jsDelivr
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-jsdelivr
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global pver@0.0.43
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Version the source without publishing to npm
        run: pver release --git --package-json --push-main
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN || github.token }}
      - name: Publish the package archive for jsDelivr
        run: node scripts/publish-cdn-package.mjs
